name: CI

# Deployments are handled by Vercel's GitHub integration: every PR gets a
# preview and every push to main goes to production. This workflow only checks
# the code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts requires a URL; generate and unit tests never connect.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
